[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
description = "Repository automation for mono releases"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1"
mono = { path = ".." }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
