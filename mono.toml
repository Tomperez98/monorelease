schema = 1

[project]
name = "mono"
default_pipeline = "ci"

[pipelines.ci]
tasks = ["changelog-validate", "fmt", "check", "test", "clippy"]

[pipelines.release]
tasks = ["release-verify"]

[tasks.changelog-validate]
command = ["cargo", "run", "--locked", "--quiet", "--", "changelog", "validate"]
timeout_seconds = 30

[tasks.fmt]
command = ["cargo", "fmt", "--check"]
timeout_seconds = 30

[tasks.check]
command = ["cargo", "check", "--workspace", "--all-targets", "--all-features"]
depends_on = ["fmt"]
timeout_seconds = 120

[tasks.test]
command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
depends_on = ["check"]
timeout_seconds = 120

[tasks.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
depends_on = ["test"]
timeout_seconds = 120

[tasks.release-notes]
command = ["cargo", "run", "--locked", "--quiet", "--", "changelog", "notes"]
timeout_seconds = 60

[tasks.changelog]
command = ["cargo", "run", "--locked", "--quiet", "--", "changelog", "scaffold"]
timeout_seconds = 60

[tasks.release-verify]
command = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "verify"]
depends_on = ["release-notes"]
timeout_seconds = 300
