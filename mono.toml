[project]
name = "mono"
default_pipeline = "ci"

[pipelines.ci]
tasks = ["changelog-check", "fmt", "check", "test", "clippy"]

[pipelines.release]
tasks = ["release-verify"]

# Validate the pinned checkout before creating a release tag. The tagged
# workflow runs the separate `release` pipeline after stamping manifests.
[pipelines.release-preflight]
tasks = ["release-contract-check", "release-notes", "package-check"]

[tasks.changelog-check]
command = ["cargo", "run", "--locked", "--quiet", "--", "changelog", "check"]
timeout_seconds = 30

[tasks.release-contract-check]
command = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "release-check"]
timeout_seconds = 30

[tasks.fmt]
command = ["cargo", "fmt", "--check"]
timeout_seconds = 30

[tasks.check]
command = ["cargo", "check", "--workspace", "--all-targets", "--all-features"]
depends_on = ["fmt"]
timeout_seconds = 120

[tasks.check-docs]
command = ["zensical", "build"]
timeout_seconds = 120

[tasks.test]
command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
depends_on = ["check"]
timeout_seconds = 120

[tasks.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
depends_on = ["test"]
timeout_seconds = 120

[tasks.release-notes]
command = ["cargo", "run", "--locked", "--quiet", "--", "changelog", "release-notes"]
depends_on = ["changelog-check"]
timeout_seconds = 60

[tasks.changelog]
command = ["cargo", "run", "--locked", "--quiet", "--", "changelog", "prepare"]
timeout_seconds = 60

[tasks.release-verify]
command = ["cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "verify"]
depends_on = ["release-notes"]
timeout_seconds = 300

[tasks.package-check]
command = ["cargo", "package", "--locked"]
depends_on = ["clippy"]
timeout_seconds = 120
