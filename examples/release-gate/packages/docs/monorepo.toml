[package]
name = "docs"

[tasks.build]
command = ["echo", "[docs] build from site with MODE=check"]
cwd = "site"
env = { MODE = "check" }
timeout_seconds = 30

[tasks.test]
command = ["echo", "[docs] test"]
depends_on = ["build"]
resource_group = "checks"
timeout_seconds = 30

[tasks.package]
command = ["echo", "[docs] package"]
depends_on = ["test"]
timeout_seconds = 30
