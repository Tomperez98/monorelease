schema = 1

[project]
name = "release-gate"

[pipelines.ci]
tasks = ["api-build", "web-build", "docs-build", "api-test", "web-test", "docs-test"]

[pipelines.release]
tasks = ["release-summary"]

[tasks.api-build]
command = ["echo", "[api] build"]
cwd = "packages/api"
timeout_seconds = 30

[tasks.api-test]
command = ["echo", "[api] test"]
cwd = "packages/api"
depends_on = ["api-build"]
resource_group = "checks"
timeout_seconds = 30

[tasks.api-package]
command = ["echo", "[api] package"]
cwd = "packages/api"
depends_on = ["api-test"]
timeout_seconds = 30

[tasks.web-build]
command = ["echo", "[web] build after api-build"]
cwd = "packages/web"
depends_on = ["api-build"]
timeout_seconds = 30

[tasks.web-test]
command = ["echo", "[web] test after build and api-test"]
cwd = "packages/web"
depends_on = ["web-build", "api-test"]
resource_group = "checks"
timeout_seconds = 30

[tasks.web-package]
command = ["echo", "[web] package"]
cwd = "packages/web"
depends_on = ["web-test"]
timeout_seconds = 30

[tasks.docs-build]
command = ["echo", "[docs] build from site with MODE=check"]
cwd = "packages/docs/site"
env = { MODE = "check" }
timeout_seconds = 30

[tasks.docs-test]
command = ["echo", "[docs] test"]
cwd = "packages/docs"
depends_on = ["docs-build"]
resource_group = "checks"
timeout_seconds = 30

[tasks.docs-package]
command = ["echo", "[docs] package"]
cwd = "packages/docs"
depends_on = ["docs-test"]
timeout_seconds = 30

[tasks.release-verify]
command = ["echo", "[release] verify artifacts, installability, and versions"]
depends_on = ["api-package", "web-package", "docs-package"]
cwd = "automation"
timeout_seconds = 60
resource_group = "release-gate"

[tasks.release-summary]
command = ["echo", "[release] release gate passed once for all packages"]
depends_on = ["release-verify"]
cwd = "automation"
timeout_seconds = 60
