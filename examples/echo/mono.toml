schema = 1

[project]
name = "echo-demo"

[pipelines.ci]
tasks = ["app-build", "app-test", "docs-build", "docs-test"]

[pipelines.release]
tasks = ["app-package", "docs-package", "shared-package"]

[tasks.shared-build]
command = ["echo", "[shared] build"]
cwd = "packages/shared"

[tasks.shared-test]
command = ["echo", "[shared] test"]
cwd = "packages/shared"
depends_on = ["shared-build"]
resource_group = "checks"

[tasks.shared-package]
command = ["echo", "[shared] package"]
cwd = "packages/shared"
depends_on = ["shared-test"]

[tasks.app-build]
command = ["echo", "[app] build after shared-build"]
cwd = "packages/app"
depends_on = ["shared-build"]
timeout_seconds = 30

[tasks.app-test]
command = ["echo", "[app] test after build and shared-test"]
cwd = "packages/app"
depends_on = ["app-build", "shared-test"]
resource_group = "checks"
timeout_seconds = 30

[tasks.app-package]
command = ["echo", "[app] package"]
cwd = "packages/app"
depends_on = ["app-test"]
timeout_seconds = 30

[tasks.docs-build]
command = ["echo", "[docs] build from site with MODE=check"]
cwd = "packages/docs/site"
env = { MODE = "check" }
resource_group = "documentation"
timeout_seconds = 30

[tasks.docs-test]
command = ["echo", "[docs] test"]
cwd = "packages/docs"
depends_on = ["docs-build"]
resource_group = "checks"
timeout_seconds = 30

[tasks.docs-package]
command = ["echo", "[docs] package"]
cwd = "packages/docs"
depends_on = ["docs-test"]
timeout_seconds = 30
