schema = 1

[project]
name = "cache-demo"

[pipelines.ci]
tasks = ["build", "verify"]

[tasks.build]
command = ["sh", "-c", "cat input.txt > dist/artifact.txt; printf '[build] generated artifact from input: '; cat input.txt"]
cwd = "packages/app"
cache = true
inputs = ["packages/app/input.txt"]
outputs = ["packages/app/dist/artifact.txt"]
timeout_seconds = 30

[tasks.verify]
command = ["sh", "-c", "test -f dist/artifact.txt && printf '[verify] artifact: ' && cat dist/artifact.txt"]
cwd = "packages/app"
depends_on = ["build"]
timeout_seconds = 30
