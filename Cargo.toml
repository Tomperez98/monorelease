[package]
name = "mono"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Manifest-driven project command orchestration"
license = "Apache-2.0"
repository = "https://github.com/Tomperez98/mono"
# Repository automation, not part of the published crate.
exclude = ["/xtask"]

[workspace]
members = ["xtask"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
ctrlc = "3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = "1.1.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
