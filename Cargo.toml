[package]
name = "mono"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Manifest-driven project command orchestration"
license = "Apache-2.0"
repository = "https://github.com/Tomperez98/mono"
# Repository automation, not part of the published crate.
exclude = ["/xtask"]

[workspace]
members = ["xtask"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = "0.28"
process-wrap = { version = "10.0.0", features = ["std"] }
ctrlc = "3.4"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = "1.1.5"
