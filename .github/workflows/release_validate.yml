name: Release (validate)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '0 */6 * * *'
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate published release
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Selecting the release and checking out validation code are workflow
      # plumbing. The validator clones the immutable release source itself.
      - name: Find latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo 'No published release exists yet.'
          fi

      - name: Check out validation source
        if: steps.release.outputs.exists == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        if: steps.release.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        if: steps.release.outputs.exists == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-validation

      - name: Validate release contract and published documentation
        if: steps.release.outputs.exists == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --quiet -p xtask -- release-validate-published

  validate_platform:
    name: Validate ${{ matrix.target }} artifact
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'schedule' || github.event.schedule == '0 3 * * 0') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Find latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo 'No published release exists yet.'
          fi

      - name: Check out validation source
        if: steps.release.outputs.exists == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        if: steps.release.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: 1.88.0

      - name: Cache Cargo dependencies
        if: steps.release.outputs.exists == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-validation-${{ matrix.target }}

      - name: Validate platform artifact
        if: steps.release.outputs.exists == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --quiet -p xtask -- release-validate-platform --target "${{ matrix.target }}"

  validate_installer:
    name: Execute ${{ matrix.installer }} installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer: shell
          - os: macos-latest
            installer: shell
          - os: macos-15-intel
            installer: shell
          - os: windows-latest
            installer: powershell
    steps:
      - name: Find latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo 'No published release exists yet.'
          fi

      - name: Execute published POSIX installer
        if: steps.release.outputs.exists == 'true' && matrix.installer == 'shell'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euxo pipefail
          installer_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/install.sh"
          prefix="$RUNNER_TEMP/mono-install"
          export MONO_INSTALL_DIR="$prefix"
          curl -fsSL "$installer_url" | sh
          reported="$($prefix/bin/mono --version)"
          test "$reported" = "mono ${RELEASE_TAG#v}"

      - name: Execute published PowerShell installer
        if: steps.release.outputs.exists == 'true' && matrix.installer == 'powershell'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MONO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'mono-install'
          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/install.ps1"
          irm $installerUrl | iex
          $installed = Join-Path $env:MONO_INSTALL_DIR 'bin\mono.exe'
          $reported = (& $installed --version).Trim()
          if ($reported -ne "mono $($env:RELEASE_TAG.Substring(1))") {
            throw "unexpected installed version: $reported"
          }
