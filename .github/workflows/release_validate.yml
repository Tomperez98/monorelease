name: Release (validate)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: release-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate published artifacts
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo 'No release exists yet; validation is complete.'
          fi

      - name: Download latest release assets
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download --repo "$GITHUB_REPOSITORY" --dir dist --clobber

      - name: Verify checksums
        if: steps.release.outputs.exists == 'true'
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Smoke-test Linux artifact
        if: steps.release.outputs.exists == 'true'
        working-directory: dist
        run: |
          archive="$(find . -name '*x86_64-unknown-linux-gnu.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir extracted
          tar -xzf "$archive" -C extracted
          ./extracted/monorelease --version
