name: Release

on:
  push:
    tags: ['v*']
  # Resuming a release that failed halfway through: point this at the tag that
  # already exists instead of moving it.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

# Start from no permissions; every job grants exactly what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The tag being released. On a push this is the tag; on a manual run it is the
  # input, so a failed release can be resumed without touching the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.source-identity.outputs.source_commit }}
      tag_object: ${{ steps.source-identity.outputs.tag_object }}
    env:
      # The release gates smoke-test this binary against the examples.
      MONO_BIN: target/debug/mono
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Capture release source identity
        id: source-identity
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "RELEASE_TAG must match v<major>.<minor>.<patch>, got '$RELEASE_TAG'" >&2
            exit 1
          }

          checkout_commit="$(git rev-parse HEAD)"
          tag_object=''
          if [[ "$(git cat-file -t "$RELEASE_TAG")" == tag ]]; then
            tag_object="$(git rev-parse "$RELEASE_TAG^{tag}")"
          fi

          echo "source_commit=$checkout_commit" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "release tag: $RELEASE_TAG"
          echo "source commit: $checkout_commit"
          if [[ -n "$tag_object" ]]; then
            echo "annotated tag object: $tag_object"
          else
            echo "tag type: lightweight"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify release source with Mono
        run: |
          cargo run --locked --quiet -- release source \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)"

      - name: Check tag matches Cargo package version
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mono") | .version')"
          test "$tag_version" = "$package_version" || {
            echo "tag v$tag_version does not match Cargo.toml version $package_version" >&2
            exit 1
          }

      - name: Run project CI pipeline
        run: cargo run --locked -- ci --no-cache --output github-actions

      - name: Run release gates
        run: cargo run --locked -- run release --no-cache --output github-actions

      - name: Upload release notes
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

      - name: Verify distributable package
        run: cargo package --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      # The artifact must identify itself as the release being cut, not as
      # whatever the source happened to carry.
      - name: Assert artifact identity
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          binary="target/${{ matrix.target }}/release/mono"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then binary="$binary.exe"; fi
          reported="$("$binary" --version)"
          echo "$reported"
          test "$reported" = "mono $version" || {
            echo "$binary reports '$reported', expected 'mono $version'" >&2
            exit 1
          }

      - name: Package Unix artifact
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/mono-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" mono \
            -C "$GITHUB_WORKSPACE" LICENSE README.md

      - name: Package Windows artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $staging = "dist/staging"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mono.exe" "$staging/mono.exe"
          Copy-Item LICENSE "$staging/LICENSE"
          Copy-Item README.md "$staging/README.md"
          Compress-Archive `
            -Path "$staging/*" `
            -DestinationPath "dist/mono-$env:RELEASE_TAG-${{ matrix.target }}.zip"
          Remove-Item -Recurse -Force $staging

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/mono-*

      - name: Upload release artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: artifact-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      # The run the CLI records as having produced the release.
      RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # `release manifest` needs the released source, not the default branch:
      # `release_validate.yml` checks the published metadata against this code.
      - name: Check out the released source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: 1.88.0

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-notes
          path: notes

      # `BUILD-METADATA.json` and `SHA256SUMS` are written by the same command
      # that `release_validate.yml` reads them back with, so the producer and
      # the consumer cannot disagree about the schema.
      - name: Write expected release inventory
        shell: bash
        run: |
          cat > release-expected.txt <<EOF
          mono-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz
          mono-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz
          mono-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz
          mono-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip
          EOF

      - name: Write release metadata
        run: |
          cargo run --locked --quiet -- release manifest \
            --directory dist \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --tag-object "$RELEASE_TAG_OBJECT" \
            --workflow-run "$RELEASE_RUN_URL" \
            --expected release-expected.txt

      # A manifest the validator would reject must never reach a release.
      - name: Verify release metadata
        run: |
          cargo run --locked --quiet -- release verify \
            --directory dist \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --tag-object "$RELEASE_TAG_OBJECT" \
            --workflow-run "$RELEASE_RUN_URL" \
            --expected release-expected.txt

      - name: Verify release asset inventory
        working-directory: dist
        shell: bash
        run: |
          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          archive_expected_file="$(mktemp)"
          checksum_file="$(mktemp)"
          trap 'rm -f "$expected_file" "$actual_file" "$archive_expected_file" "$checksum_file"' EXIT

          cat > "$expected_file" <<EOF
          BUILD-METADATA.json
          SHA256SUMS
          mono-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz
          mono-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz
          mono-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz
          mono-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip
          EOF

          for path in ./*; do
            [[ -f "$path" ]] && basename "$path"
          done | sort > "$actual_file"
          sort -o "$expected_file" "$expected_file"
          diff -u "$expected_file" "$actual_file"

          grep -v -E '^(BUILD-METADATA.json|SHA256SUMS)$' "$expected_file" > "$archive_expected_file"
          awk 'NF { print $2 }' SHA256SUMS | sort > "$checksum_file"
          diff -u "$archive_expected_file" "$checksum_file"
          sha256sum -c SHA256SUMS

      # Publishing is idempotent: a run that failed after pushing some assets is
      # resumed against the same draft tag, and an already published tag is
      # never overwritten.
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$state" == "false" ]]; then
            echo "::error::$RELEASE_TAG is already published; refusing to overwrite it."
            exit 1
          fi
          if [[ -z "$state" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file notes/RELEASE_NOTES.md
          else
            echo "$RELEASE_TAG is an existing draft; reusing it."
          fi

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      # The release only becomes the latest release once every asset is in place.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file notes/RELEASE_NOTES.md \
            --draft=false \
            --latest

  alert_failure:
    name: Alert on failure
    needs: [validate, build, publish]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Annotate the failed run
        run: |
          echo "::error::$RELEASE_TAG failed. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
