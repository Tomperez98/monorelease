name: Release

on:
  push:
    tags: ['v*']
  # Resuming a release that failed halfway through: point this at the tag that
  # already exists instead of moving it.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

# Start from no permissions; every job grants exactly what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The tag being released. On a push this is the tag; on a manual run it is the
  # input, so a failed release can be resumed without touching the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.source-identity.outputs.source_commit }}
      tag_object: ${{ steps.source-identity.outputs.tag_object }}
    env:
      # The release gates smoke-test this binary against the examples.
      MONO_BIN: target/debug/mono
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Capture release source identity
        id: source-identity
        shell: bash
        run: |
          checkout_commit="$(git rev-parse HEAD)"
          tag_object=''
          if [[ "$(git cat-file -t "$RELEASE_TAG")" == tag ]]; then
            tag_object="$(git rev-parse "$RELEASE_TAG^{tag}")"
          fi

          echo "source_commit=$checkout_commit" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "release tag: $RELEASE_TAG"
          echo "source commit: $checkout_commit"
          if [[ -n "$tag_object" ]]; then
            echo "annotated tag object: $tag_object"
          else
            echo "tag type: lightweight"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The coordinator validates the immutable source, stamps all release
      # files, runs CI and release gates, packages the crate, writes notes, and
      # restores the committed placeholders before returning.
      - name: Prepare the release
        run: cargo run --locked --quiet -p xtask -- release-prepare --tag "$RELEASE_TAG"

      - name: Upload release notes
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # xtask owns stamping, building, identity checks, archive naming, and
      # packaging. The matrix only selects native runners and target triples.
      - name: Build and package release artifact
        run: cargo run --locked --quiet -p xtask -- release-build --target "${{ matrix.target }}" --directory dist

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/mono-*

      - name: Upload release artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: artifact-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      # The run the CLI records as having produced the release.
      RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # `release manifest` needs the released source, not the default branch:
      # `release_validate.yml` checks the published metadata against this code.
      - name: Check out the released source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: 1.88.0

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-notes
          path: notes

      # The repository-specific xtask owns the artifact inventory, metadata,
      # checksum, and identity contract. GitHub Actions only assembles the
      # directory and publishes it.
      - name: Write and verify release contract
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: cargo run --locked --quiet -p xtask -- release-contract --directory dist

      # Build the versioned documentation in the same release job as the
      # binaries. The coordinator stamps and restores the release files around
      # the build, so this checkout returns to its pinned state. It also renders
      # the installers into site/ with this release's tag and SHA256SUMS digests
      # baked in, which is what makes the published copy resolve nothing at run
      # time.
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Build versioned documentation
        run: cargo run --locked --quiet -p xtask -- release-docs --version "${RELEASE_TAG#v}" --directory dist

      - name: Verify release versions
        run: cargo run --locked --quiet -p xtask -- release-version-check --site site --notes notes/RELEASE_NOTES.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload documentation Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      # The coordinator makes publication retry-safe: it refuses an already
      # published tag, reuses an existing draft, and uploads the complete
      # artifact directory.
      - name: Create draft and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: cargo run --locked --quiet -p xtask -- release-publish --directory dist --notes notes/RELEASE_NOTES.md

      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # The release only becomes the latest release once every binary asset and
      # the versioned documentation site are in place.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: cargo run --locked --quiet -p xtask -- release-publish --notes notes/RELEASE_NOTES.md --finalize

  alert_failure:
    name: Alert on failure
    needs: [validate, build, publish]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Annotate the failed run
        run: |
          echo "::error::$RELEASE_TAG failed. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
